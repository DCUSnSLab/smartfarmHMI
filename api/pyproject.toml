[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfarmhmi-api"
version = "0.1.0"
description = "스마트팜 HMI 애플리케이션 서버 (Django LTS + DRF + Channels)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  # Web framework — AIBootcamp api 와 동일 계열
  "Django>=5.2,<5.3",
  "djangorestframework>=3.15,<3.17",
  "djangorestframework-simplejwt>=5.3,<5.5",
  "drf-spectacular>=0.27,<0.29",
  "django-cors-headers>=4.4,<4.7",
  "django-environ>=0.11,<0.13",

  # WebSocket (Channels) + ASGI
  "channels>=4.1,<4.3",
  "channels-redis>=4.2,<4.4",
  # redis 는 channels-redis 의 전이 의존성이지만 **직접 선언한다.**
  # 여기만 상한이 없어서, 재빌드가 8.x 를 끌어오며 socket_timeout 기본값이 None →
  # 5초로 바뀐 것을 아무도 못 봤다. 그 5초가 channels-redis 의 BRPOP 대기(5초)와
  # 같아져 우편함이 빌 때마다 컨슈머가 죽었다 (GEN-1323, settings/base.py 주석).
  # 이 저장소는 다른 패키지 전부에 상한을 두는데 redis 만 전이라 규칙에서 빠져 있었다.
  # 테스트도 redis 를 직접 import 하므로(apps/core/tests) 선언이 맞다.
  "redis>=8.1,<9",
  "uvicorn[standard]>=0.30,<0.36",

  # DB / crypto
  "psycopg[binary]>=3.2,<3.3",
  "argon2-cffi>=23.1,<25",

  # 내부 MQTT 구독 (증분 3, management command 단일 프로세스)
  "aiomqtt>=2.0,<2.4",

  # 미들웨어 내부 REST 클라이언트
  "httpx>=0.27,<0.29",

  # 농업일지 사진 첨부 저장소
  "minio>=7.2,<8",

  "django-redis>=5.4,<5.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-django>=4.8,<5",
  "ruff>=0.5,<0.13",
  "mypy>=1.10,<1.16",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
