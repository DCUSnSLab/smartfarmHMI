apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartfarmhmi-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: smartfarmhmi-api }
  template:
    metadata:
      labels: { app: smartfarmhmi-api }
    spec:
      # WebSocket 을 들고 있어 종료 시 정리할 것이 있다 — 유예 안에 SIGTERM 처리가
      # 끝나지 않으면 SIGKILL 이 되고, 그러면 Channels 그룹 등록이 남아 24시간(기본
      # group_expiry) 동안 방송이 유령에게 나간다. 기본값(30초)을 명시해 의도를 남긴다.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: harbor.cu.ac.kr/smartfarmhmi-dev/api
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: smartfarmhmi-config }
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: django-secret, key: SECRET_KEY } }
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: APP_DB_PASSWORD } }
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ACCESS_KEY } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: smartfarmhmi-api
spec:
  selector: { app: smartfarmhmi-api }
  ports: [{ port: 8000, targetPort: 8000 }]
