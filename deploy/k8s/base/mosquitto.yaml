# MQTT 브로커 — 배치(별도 vs 미들웨어 동거)·TLS·ACL 은 OPN-22.
# 스켈레톤은 별도 Deployment 로 두고, conf 는 ConfigMap(smartfarmhmi-mosquitto-conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels: { app: mosquitto }
  template:
    metadata:
      labels: { app: mosquitto }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports: [{ containerPort: 1883 }]
          volumeMounts:
            - name: conf
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 1883 }
            periodSeconds: 10
      volumes:
        - name: conf
          configMap: { name: smartfarmhmi-mosquitto-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app: mosquitto }
  ports: [{ port: 1883, targetPort: 1883 }]
