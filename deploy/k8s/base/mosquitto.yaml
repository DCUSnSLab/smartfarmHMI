# MQTT 브로커 — 배치(별도 vs 미들웨어 동거)·TLS·ACL 은 OPN-22.
# 스켈레톤은 별도 Deployment 로 두고, conf 는 ConfigMap(smartfarmhmi-mosquitto-conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels: { app: mosquitto }
  template:
    metadata:
      labels: { app: mosquitto }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports: [{ containerPort: 1883 }, { containerPort: 9001 }]
          volumeMounts:
            - name: conf
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            # conf 의 persistence_location. 재시작 시 유실돼도 무방한 세션 상태라
            # PVC 대신 emptyDir — 다만 쓰기 가능한 디렉토리는 있어야 한다.
            - { name: data, mountPath: /mosquitto/data }
          readinessProbe:
            tcpSocket: { port: 1883 }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: smartfarmhmi-mosquitto-conf }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: { app: mosquitto }
  ports:
    - { name: mqtt, port: 1883, targetPort: 1883 }
    # nginx 의 /mqtt 가 넘겨준다. ClusterIP 유지 — 외부 노출은 nginx 하나로.
    - { name: websockets, port: 9001, targetPort: 9001 }
