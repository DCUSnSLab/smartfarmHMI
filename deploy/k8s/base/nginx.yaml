# 단일 진입점 — 외부 노출은 overlay 의 Service 패치로 결정 (dev: NodePort)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartfarmhmi-nginx
spec:
  replicas: 1
  selector:
    matchLabels: { app: smartfarmhmi-nginx }
  template:
    metadata:
      labels: { app: smartfarmhmi-nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
      volumes:
        - name: conf
          configMap: { name: smartfarmhmi-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: smartfarmhmi-nginx
spec:
  selector: { app: smartfarmhmi-nginx }
  ports: [{ port: 80, targetPort: 80 }]
