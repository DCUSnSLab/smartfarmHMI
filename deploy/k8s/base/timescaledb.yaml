# TimescaleDB — StatefulSet + Service
# Secret(postgres-credentials)은 수동 생성 — deploy/k8s/README.md
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: { app: timescaledb }
  template:
    metadata:
      labels: { app: timescaledb }
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: postgres-credentials }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: initdb
          configMap: { name: smartfarmhmi-db-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # 사내 클러스터 기본 SC (AIBootcamp deploy/k8s 와 동일). SC 이름이 다르면
        # PVC 가 Pending 으로 영구 대기하므로 클러스터에 맞춰 고칠 것.
        storageClassName: longhorn
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  selector: { app: timescaledb }
  ports: [{ port: 5432, targetPort: 5432 }]
