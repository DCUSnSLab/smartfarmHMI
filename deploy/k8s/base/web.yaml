apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartfarmhmi-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: smartfarmhmi-web }
  template:
    metadata:
      labels: { app: smartfarmhmi-web }
    spec:
      containers:
        - name: web
          image: harbor.cu.ac.kr/smartfarmhmi-dev/web
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: smartfarmhmi-config }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartfarmhmi-web
spec:
  selector: { app: smartfarmhmi-web }
  ports: [{ port: 3000, targetPort: 3000 }]
