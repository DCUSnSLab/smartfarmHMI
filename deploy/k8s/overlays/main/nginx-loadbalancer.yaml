apiVersion: v1
kind: Service
metadata:
  name: smartfarmhmi-nginx
spec:
  type: LoadBalancer
  # MetalLB second-pool(203.250.33.75-77) 에서 배정받은 고정 IP.
  # loadBalancerIP 는 k8s 표준상 deprecated 지만 사내 클러스터의 다른 서비스
  # (harbor·comai-nginx·aibootcamp-nginx)가 모두 이 방식이라 맞춘다.
  loadBalancerIP: 203.250.33.77
  ports:
    # 443 은 인증서가 없어 아직 열지 않는다 — 도메인 확보 후 cert-manager 와 함께.
    - port: 80
      targetPort: 80
