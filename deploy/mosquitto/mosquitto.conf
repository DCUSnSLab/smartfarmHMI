# Mosquitto 설정 — 개발용 (OPN-22: 인증·TLS·ACL 정책 확정 전)
#
# TODO(OPN-22): 인증(비밀번호/클라이언트 인증서) + TLS + 토픽 ACL.
#   ACL 로 강제할 규칙 (communication-interface.md §2.2):
#   - api 계정:        farmon-internal/v1/# 구독만 허용, farmon/v1/# 금지
#   - middleware 계정: farmon/v1/# + farmon-internal/v1/# 모두 허용
#   - edge 계정:       자기 farm 의 farmon/v1/{farm_id}/# 만 허용

listener 1883
protocol mqtt

# 클러스터 밖 엣지용. MQTT 는 HTTP 가 아니라 nginx 의 경로 분기를 못 타므로,
# 외부에 열려면 포트를 하나 더 받아야 한다. WebSocket 에 실으면 HTTP 가 되어
# 기존 진입점(nginx)의 /mqtt 로 들어온다 (GEN-1296).
listener 9001
protocol websockets

# dev 한정 — 운영 전 반드시 제거
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
