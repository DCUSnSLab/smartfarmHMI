# smartfarmHMI — 단일 진입점 (AIBootcamp nginx 패턴의 축소판, WAF/ModSecurity 는 추후)
# 라우팅: /api·/ws → api(Django ASGI), 나머지 → web(Next.js)

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8000; }
upstream mqtt_upstream { server mosquitto:9001; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # ── API (REST) ──
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Channels, 증분 3부터) ──
    location /ws/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── MQTT over WebSocket (클러스터 밖 엣지, GEN-1296) ──
    location = /mqtt {
        proxy_pass http://mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 웹앱 (Next.js dev HMR 포함) ──
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
