# smartfarmHMI — 단일 진입점 (AIBootcamp nginx 패턴의 축소판, WAF/ModSecurity 는 추후)
# 라우팅: /api·/ws → api(Django ASGI), 나머지 → web(Next.js)

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8000; }
upstream mqtt_upstream { server mosquitto:9001; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # ── API (REST) ──
    location /api/ {
        client_max_body_size 210m;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Channels, 증분 3부터) ──
    location /ws/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── MQTT over WebSocket (클러스터 밖 엣지) ──
    # 끝 슬래시만 함께 받는다 — 접두 일치로 열면 /mqtt 로 시작하는 다른 경로까지
    # 브로커로 넘어간다. 클라이언트마다 기본 경로가 /mqtt 와 /mqtt/ 로 갈린다.
    location ~ ^/mqtt/?$ {
        # 브로커는 /mqtt 로만 응답한다 — /mqtt/ 를 그대로 넘기면 핸드셰이크가
        # 끝나지 않고 매달려 504 가 된다 (거절이 아니라 무응답이다).
        rewrite ^/mqtt/$ /mqtt break;
        proxy_pass http://mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 웹앱 (Next.js dev HMR 포함) ──
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
