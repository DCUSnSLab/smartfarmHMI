name: smartfarmhmi

services:
  # ── 인프라 ──────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfarm}
      POSTGRES_USER: ${POSTGRES_USER:-smartfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfarm_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev}
      MW_DB_PASSWORD: ${MW_DB_PASSWORD:-mw_dev}
    ports:
      - "${HOST_DB_PORT:-45432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./deploy/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfarm} -d ${POSTGRES_DB:-smartfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_REDIS_PORT:-46379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${HOST_MINIO_PORT:-49000}:9000"
      - "${HOST_MINIO_CONSOLE_PORT:-49001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET_ATTACHMENTS:-smartfarm-attachments};
      mc mb --ignore-existing local/${MINIO_BUCKET_VIDEOS:-smartfarm-videos};
      mc anonymous set none local/${MINIO_BUCKET_ATTACHMENTS:-smartfarm-attachments};
      mc anonymous set none local/${MINIO_BUCKET_VIDEOS:-smartfarm-videos};
      echo 'MinIO buckets initialized';
      "
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${HOST_MQTT_PORT:-41883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── 애플리케이션 서비스 ──────────────────────────────────

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api,nginx,${PUBLIC_HOST:-localhost}"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HOST_API_PORT:-48000}:8000"
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 내부 MQTT → Channels 브리지 — **단일 인스턴스 전용** (tech-stack.md).
  # ASGI 워커와 분리된 보조 프로세스. 같은 api 코드베이스·이미지를 쓴다.
  api-bridge:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
    command: ["python", "manage.py", "mqtt_bridge"]
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ./api:/app

  middleware:
    build:
      context: .                      # shared/ 포함 필요 → 루트 컨텍스트
      dockerfile: middleware/Dockerfile
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: timescaledb
      MQTT_HOST: mosquitto
      WEATHER_KEY: "${WEATHER_KEY:-change-me}"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "${HOST_MW_PORT:-48001}:8001"
    volumes:
      - ./middleware:/app/middleware
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 가상 엣지 — 기본 스택의 데이터원. 컨테이너 1개 = 팜 1개 (virtual-edge/README.md).
  # 기본 멀티팜: 성주(virtual-edge) + 진주(virtual-edge-jinju).
  # 격리 연동 테스트는 virtual-edge/ 의 자체 compose 로 별도 수행 (hwaseong·gimje —
  # 기본 스택 팜과 farm_id 를 겹치지 않게 유지: 같은 팜의 발행자 중복 = LWT 충돌).
  virtual-edge:
    build:
      context: ./virtual-edge         # 독립 프로젝트 — 루트 컨텍스트 불필요
      dockerfile: Dockerfile
    environment:
      MQTT_HOST: mosquitto            # 기본 스택에서는 브로커 직결 (env 가 config 오버라이드)
      MQTT_PORT: 1883
      VEDGE_CONFIG: /configs/seongju.yaml
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./virtual-edge/configs:/configs:ro
      - ./virtual-edge/vedge:/app/vedge

  virtual-edge-jinju:
    build:
      context: ./virtual-edge
      dockerfile: Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      VEDGE_CONFIG: /configs/jinju.yaml
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./virtual-edge/configs:/configs:ro
      - ./virtual-edge/vedge:/app/vedge

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: "http://${PUBLIC_HOST:-localhost}:${HOST_GATEWAY_PORT:-48080}"
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HOST_WEB_PORT:-43000}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  # ── 단일 진입점 (운영은 이 포트만 노출) ──────────────────
  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "${HOST_GATEWAY_PORT:-48080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  timescaledb_data:
  redis_data:
  minio_data:
  mosquitto_data:
