[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfarmhmi-edge-sim"
version = "0.1.0"
description = "스마트팜 HMI 임의 데이터 생성기 (2차년도 한정 엣지 대역)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "aiomqtt>=2.0,<2.4",
  "pydantic>=2.8,<2.11",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
