# 김제 벼 노지 — **격리 연동 테스트 하네스 전용** 둘째 팜 (--profile multi)
# 기본 스택 팜(seongju·jinju)과 farm_id 를 겹치지 않게 유지한다
# (같은 팜의 발행자 중복 = LWT·retained 충돌).
farm_id: gimje
edge_id: edge-01
growbed_id: growbed-01

broker:
  host: host.docker.internal
  port: 41883

sensors:
  - { id: temp-a,  type: temperature, unit: celsius, interval_sec: 8,
      base: 27.0, amplitude: 4.0, noise: 0.3, location: 논 중앙 }
  - { id: hum-a,   type: humidity, unit: percent, interval_sec: 8,
      base: 62.0, amplitude: 8.0, noise: 1.2, location: 논 중앙 }
  - { id: ec-a,    type: ec, unit: mS/cm, interval_sec: 15,
      base: 1.2, amplitude: 0.1, noise: 0.04, location: 급수로 }
  - { id: power-a, type: power, unit: kW, interval_sec: 20,
      base: 1.1, noise: 0.05, location: 배전반 }
  - { id: tank-water-lv, type: water_level, unit: percent, interval_sec: 40,
      base: 76.0, drain_per_hour: 2.2, noise: 0.1, location: 용수 탱크 }

actuators:
  - { id: doser-a, command: set_ec, affects: ec-a, drains: tank-water-lv }
