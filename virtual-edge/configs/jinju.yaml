# 진주 토마토 온실 — 기본 개발 스택의 둘째 팜 (virtual-edge-jinju 서비스)
# 센서·로봇 id 는 middleware/scripts/seed.py 의 jinju 절과 일치해야 한다.
farm_id: jinju
edge_id: edge-01
growbed_id: growbed-01

broker:
  host: host.docker.internal
  port: 41883

sensors:
  - { id: temp-a,  type: temperature, unit: celsius, interval_sec: 7,
      base: 25.0, amplitude: 2.5, noise: 0.2, location: 온실 중앙 }
  - { id: hum-a,   type: humidity, unit: percent, interval_sec: 7,
      base: 55.0, amplitude: 6.0, noise: 1.0, location: 온실 중앙 }
  - { id: ec-a,    type: ec, unit: mS/cm, interval_sec: 12,
      base: 2.0, amplitude: 0.15, noise: 0.04, location: 공급 라인 }
  - { id: power-a, type: power, unit: kW, interval_sec: 20,
      base: 2.2, noise: 0.06, location: 배전반 }
  - { id: tank-nutrient-lv, type: water_level, unit: percent, interval_sec: 40,
      base: 60.0, drain_per_hour: 1.0, noise: 0.1, location: 양액 탱크 }

actuators:
  - { id: heater-a, command: set_temperature, affects: temp-a, power_kw: 1.5 }
  - { id: doser-a,  command: set_ec,          affects: ec-a,   drains: tank-nutrient-lv }

robots:
  - { id: robot-01, behavior: transport, interval_sec: 5, cycle_sec: 360 }
